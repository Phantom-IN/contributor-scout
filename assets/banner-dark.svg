<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Contributor Scout — evidence-first open-source contribution discovery, for Claude Code, Copilot, Cursor and Antigravity">
  <title>Contributor Scout</title>
  <desc>Evidence-first open-source contribution discovery for Claude Code, GitHub Copilot, Cursor and Antigravity. Reads, reasons, reports — it never writes code.</desc>

  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#111823"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <radialGradient id="vig-dark" cx="50%" cy="46%" r="78%">
      <stop offset="55%" stop-color="#05070c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="pane-dark" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#1a212c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="wm-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="52%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="strip-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee787"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#7ee787"/>
    </linearGradient>
    <linearGradient id="rule-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0"/>
      <stop offset="34%" stop-color="#7ee787" stop-opacity="0.85"/>
      <stop offset="66%" stop-color="#79c0ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam-dark" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0%" stop-color="#79c0ff" stop-opacity="0"/>
      <stop offset="42%" stop-color="#79c0ff" stop-opacity="0.05"/>
      <stop offset="58%" stop-color="#7ee787" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#7ee787" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#21262d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#21262d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.038"/>
    </pattern>
    <filter id="glow-dark" x="-12%" y="-90%" width="124%" height="280%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feComponentTransfer in="b">
        <feFuncA type="linear" slope="0.30"/>
      </feComponentTransfer>
    </filter>
    <filter id="drop-dark" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="18"
                    flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="clip-dark">
      <rect x="40" y="34" width="1200" height="372" rx="16"/>
    </clipPath>
  </defs>

  <!-- canvas -->
  <rect width="1280" height="440" fill="url(#bg-dark)"/>
  <rect width="1280" height="440" fill="url(#vig-dark)"/>
  <path d="M16 16 h13 M16 16 v13" stroke="#79c0ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.40"/>
  <path d="M1264 16 h-13 M1264 16 v13" stroke="#79c0ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.40"/>
  <path d="M16 424 h13 M16 424 v-13" stroke="#79c0ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.40"/>
  <path d="M1264 424 h-13 M1264 424 v-13" stroke="#79c0ff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.40"/>

  <!-- terminal pane -->
  <rect x="40" y="34" width="1200" height="372" rx="16"
        fill="#0d1117" filter="url(#drop-dark)"/>
  <g clip-path="url(#clip-dark)">
    <rect x="40" y="34" width="1200" height="372" fill="url(#pane-dark)"/>
    <rect x="40" y="34" width="1200" height="372" fill="url(#grid-dark)"/>
    <rect x="40" y="34" width="1200" height="372" fill="url(#beam-dark)"/>
    <rect x="40" y="34" width="1200" height="44" fill="#161b22"/>
    <rect x="40" y="34" width="1200" height="3" fill="url(#strip-dark)" opacity="0.8"/>
    <line x1="40" y1="78" x2="1240" y2="78" stroke="#30363d"/>
  </g>
  <rect x="40" y="34" width="1200" height="372" rx="16" fill="none" stroke="#30363d"/>

  <!-- chrome bar -->
  <circle cx="66" cy="56.0" r="6" fill="#ff5f57" opacity="0.92"/>
  <circle cx="88" cy="56.0" r="6" fill="#febc2e" opacity="0.92"/>
  <circle cx="110" cy="56.0" r="6" fill="#28c840" opacity="0.92"/>
  <text x="144" y="60.6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="0.6" fill="#6e7681">contributor-scout</text>
  <text x="1216.0" y="60.2" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="0.5" fill="#6e7681">claude code<tspan fill="#545d68"> · </tspan>copilot<tspan fill="#545d68"> · </tspan>cursor<tspan fill="#545d68"> · </tspan>antigravity</text>

  <!-- prompt -->
  <text x="68" y="116" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="0.8" fill="#6e7681"><tspan fill="#7ee787">$</tspan> contributor-scout profile</text>
  <rect x="340.8" y="104" width="9" height="16" rx="1.5" fill="#79c0ff" opacity="0.65"/>

  <!-- wordmark -->
  <text x="645.2" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="63" font-weight="700" letter-spacing="10.5" fill="url(#wm-dark)" filter="url(#glow-dark)">CONTRIBUTOR SCOUT</text>
  <text x="645.2" y="206" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="63" font-weight="700" letter-spacing="10.5" fill="url(#wm-dark)">CONTRIBUTOR SCOUT</text>

  <!-- accent rule + tagline -->
  <rect x="270" y="234" width="740" height="2" rx="1" fill="url(#rule-dark)"/>
  <text x="640.8" y="272" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" letter-spacing="1.6" fill="#8b949e">evidence-first open-source contribution discovery</text>

  <!-- evidence tags -->
  <rect x="370.6" y="302" width="83.3" height="28" rx="14" fill="#11161d" stroke="#2c333d"/>
  <text x="412.2" y="320.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="0.9" fill="#adbac7"><tspan fill="#7ee787">[</tspan>CODE<tspan fill="#7ee787">]</tspan></text>
  <rect x="464.9" y="302" width="83.3" height="28" rx="14" fill="#11161d" stroke="#2c333d"/>
  <text x="506.6" y="320.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="0.9" fill="#adbac7"><tspan fill="#7ee787">[</tspan>TEST<tspan fill="#7ee787">]</tspan></text>
  <rect x="559.2" y="302" width="109.4" height="28" rx="14" fill="#11161d" stroke="#2c333d"/>
  <text x="613.9" y="320.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="0.9" fill="#adbac7"><tspan fill="#7ee787">[</tspan>HISTORY<tspan fill="#7ee787">]</tspan></text>
  <rect x="679.6" y="302" width="135.5" height="28" rx="14" fill="#11161d" stroke="#2c333d"/>
  <text x="747.4" y="320.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="0.9" fill="#adbac7"><tspan fill="#7ee787">[</tspan>MAINTAINER<tspan fill="#7ee787">]</tspan></text>
  <rect x="826.1" y="302" width="83.3" height="28" rx="14" fill="#11161d" stroke="#2c333d"/>
  <text x="867.8" y="320.7" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="0.9" fill="#adbac7"><tspan fill="#7ee787">[</tspan>DOCS<tspan fill="#7ee787">]</tspan></text>

  <!-- footer -->
  <rect x="66" y="356" width="1148" height="1" fill="url(#fade-dark)"/>
  <text x="68" y="384" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="0.8" fill="#6e7681">reads &#183; reasons &#183; reports</text>
  <text x="1212" y="384" text-anchor="end" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="0.8" fill="#6e7681">it never writes code</text>
</svg>
